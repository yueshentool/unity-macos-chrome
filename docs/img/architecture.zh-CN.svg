<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232733"/>
      <stop offset="100%" stop-color="#171a22"/>
    </linearGradient>
    <linearGradient id="barBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4050"/>
      <stop offset="100%" stop-color="#2e3341"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1000" height="580" fill="#0f1117"/>

  <!-- ============ 左侧：模拟屏幕 ============ -->
  <g>
    <rect x="40" y="52" width="660" height="460" rx="14" fill="url(#screenBg)" stroke="#333a4a" stroke-width="1.5" filter="url(#soft)"/>

    <!-- ① 菜单栏 -->
    <g>
      <rect x="40" y="52" width="660" height="34" fill="url(#barBg)"/>
      <!-- 悬停/激活项底色先画，再画文字，避免重影 -->
      <rect x="490" y="58" width="86" height="22" rx="4" fill="#3f6f9e"/>
      <text x="56" y="74" font-size="12.5" font-weight="700" fill="#f2f4f8">Unity</text>
      <text x="104" y="74" font-size="12.5" fill="#dfe3ec">File</text>
      <text x="132" y="74" font-size="12.5" fill="#dfe3ec">Edit</text>
      <text x="160" y="74" font-size="12.5" fill="#dfe3ec">Assets</text>
      <text x="206" y="74" font-size="12.5" fill="#dfe3ec">GameObject</text>
      <text x="282" y="74" font-size="12.5" fill="#dfe3ec">Component</text>
      <text x="354" y="74" font-size="12.5" fill="#dfe3ec">Services</text>
      <text x="408" y="74" font-size="12.5" fill="#dfe3ec">Window</text>
      <text x="460" y="74" font-size="12.5" fill="#dfe3ec">Help</text>
      <text x="496" y="74" font-size="12.5" fill="#ffffff">Liquid Glass</text>
      <rect x="40" y="52" width="660" height="34" fill="none" stroke="#464e60" stroke-width="1"/>
    </g>

    <!-- ② 标题栏 -->
    <g>
      <rect x="40" y="86" width="660" height="38" fill="#2a2f3b"/>
      <circle cx="62" cy="105" r="6" fill="#ff5f57"/>
      <circle cx="82" cy="105" r="6" fill="#febc2e"/>
      <circle cx="102" cy="105" r="6" fill="#28c840"/>
      <text x="370" y="110" font-size="12.5" fill="#c8cede" text-anchor="middle">MyProject — Windows, Mac, Linux</text>
      <line x1="40" y1="124" x2="700" y2="124" stroke="#3a4152" stroke-width="1"/>
    </g>

    <!-- ④ 编辑器本体 -->
    <g>
      <rect x="52" y="136" width="120" height="360" rx="5" fill="#22262f" stroke="#313746"/>
      <rect x="180" y="136" width="230" height="200" rx="5" fill="#22262f" stroke="#313746"/>
      <rect x="418" y="136" width="270" height="200" rx="5" fill="#22262f" stroke="#313746"/>
      <rect x="180" y="344" width="508" height="152" rx="5" fill="#22262f" stroke="#313746"/>
      <text x="62" y="156" font-size="11" fill="#6f7789">Hierarchy</text>
      <text x="190" y="156" font-size="11" fill="#6f7789">Scene</text>
      <text x="428" y="156" font-size="11" fill="#6f7789">Game</text>
      <text x="190" y="364" font-size="11" fill="#6f7789">Project</text>
      <text x="62" y="176" font-size="10.5" fill="#8b93a7">Main Camera</text>
      <text x="62" y="194" font-size="10.5" fill="#8b93a7">Directional</text>
      <text x="62" y="212" font-size="10.5" fill="#8b93a7">Terrain</text>
      <text x="190" y="380" font-size="10.5" fill="#8b93a7">Assets  ▸  Scenes  ▸  Main.unity</text>
    </g>

    <!-- ③ 自绘弹层（挂在 Liquid Glass 下） -->
    <g filter="url(#soft)">
      <rect x="490" y="86" width="196" height="224" rx="10" fill="#2c2c2c" stroke="#3e3e3e" stroke-width="1.5"/>
      <rect x="492" y="90" width="192" height="22" rx="4" fill="#2c5d87"/>
      <text x="526" y="106" font-size="12" fill="#ffffff">添加白名单程序…</text>
      <text x="526" y="128" font-size="12" fill="#e8e8e8">移除白名单程序</text>
      <text x="658" y="128" font-size="12" fill="#e8e8e8">▸</text>
      <line x1="494" y1="139" x2="682" y2="139" stroke="#3e3e3e" stroke-width="1"/>
      <text x="526" y="160" font-size="12" fill="#e8e8e8">二级菜单配色</text>
      <text x="658" y="160" font-size="12" fill="#e8e8e8">▸</text>
      <text x="526" y="182" font-size="12" fill="#e8e8e8">菜单栏底色</text>
      <text x="658" y="182" font-size="12" fill="#e8e8e8">▸</text>
      <line x1="494" y1="193" x2="682" y2="193" stroke="#3e3e3e" stroke-width="1"/>
      <text x="526" y="214" font-size="12" fill="#e8e8e8">打开设置…</text>
    </g>

    <!-- 编号徽标 -->
    <g font-size="11" font-weight="700" text-anchor="middle">
      <circle cx="660" cy="69" r="10" fill="#4a9eff"/><text x="660" y="73" fill="#0f1117">1</text>
      <circle cx="130" cy="105" r="10" fill="#4a9eff"/><text x="130" y="109" fill="#0f1117">2</text>
      <circle cx="660" cy="292" r="10" fill="#4a9eff"/><text x="660" y="296" fill="#0f1117">3</text>
      <circle cx="660" cy="470" r="10" fill="#4a9eff"/><text x="660" y="474" fill="#0f1117">4</text>
    </g>
  </g>

  <!-- ============ 右侧：说明 ============ -->
  <g>
    <text x="712" y="76" font-size="13" font-weight="700" fill="#e6e8ef">窗口分层</text>
    <line x1="712" y1="86" x2="990" y2="86" stroke="#2c3140" stroke-width="1"/>

    <circle cx="724" cy="112" r="9" fill="#4a9eff"/><text x="724" y="116" font-size="10.5" font-weight="700" fill="#0f1117" text-anchor="middle">1</text>
    <text x="742" y="110" font-size="12" font-weight="600" fill="#e6e8ef">菜单栏 · MacMenuBar.cs</text>
    <text x="742" y="127" font-size="11" fill="#8b93a7">独立 WS_POPUP 窗口，横跨显示器</text>
    <text x="742" y="143" font-size="11" fill="#8b93a7">TOPMOST · TOOLWINDOW · NOACTIVATE</text>
    <text x="742" y="159" font-size="11" fill="#8b93a7">分层位图：形状与命中测试由 alpha 决定</text>

    <circle cx="724" cy="192" r="9" fill="#4a9eff"/><text x="724" y="196" font-size="10.5" font-weight="700" fill="#0f1117" text-anchor="middle">2</text>
    <text x="742" y="190" font-size="12" font-weight="600" fill="#e6e8ef">标题栏 · MacTitleBar.cs</text>
    <text x="742" y="207" font-size="11" fill="#8b93a7">去掉 WS_CAPTION，接管 WM_NCCALCSIZE</text>
    <text x="742" y="223" font-size="11" fill="#8b93a7">客户区下压 frameY + barHeight</text>
    <text x="742" y="239" font-size="11" fill="#8b93a7">WM_NCHITTEST 报 HTCAPTION，保留原生拖动</text>

    <circle cx="724" cy="272" r="9" fill="#4a9eff"/><text x="724" y="276" font-size="10.5" font-weight="700" fill="#0f1117" text-anchor="middle">3</text>
    <text x="742" y="270" font-size="12" font-weight="600" fill="#e6e8ef">下拉菜单 · MenuPopup</text>
    <text x="742" y="287" font-size="11" fill="#8b93a7">完全自绘，不用系统菜单（#32768）</text>
    <text x="742" y="303" font-size="11" fill="#8b93a7">SetCapture 收鼠标，级联子菜单同类窗口</text>
    <text x="742" y="319" font-size="11" fill="#8b93a7">选中后 PostMessage(WM_COMMAND, id)</text>

    <circle cx="724" cy="352" r="9" fill="#4a9eff"/><text x="724" y="356" font-size="10.5" font-weight="700" fill="#0f1117" text-anchor="middle">4</text>
    <text x="742" y="350" font-size="12" font-weight="600" fill="#e6e8ef">编辑器本体</text>
    <text x="742" y="367" font-size="11" fill="#8b93a7">Unity 自己绘制，插件不碰</text>
    <text x="742" y="383" font-size="11" fill="#8b93a7">原生菜单一直挂在窗口上（只盖住，不摘）</text>

    <line x1="712" y1="406" x2="990" y2="406" stroke="#2c3140" stroke-width="1"/>
    <text x="712" y="428" font-size="11" fill="#8b93a7">消息路径</text>
    <rect x="712" y="438" width="278" height="96" rx="8" fill="#161a22" stroke="#262c3a"/>
    <g font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="10.5" fill="#9fb4d0">
      <text x="726" y="458">WM_NCCALCSIZE  → 改客户区</text>
      <text x="726" y="476">WM_NCHITTEST   → HTCAPTION</text>
      <text x="726" y="494">WM_NCPAINT     → 画那条 28px</text>
      <text x="726" y="512">WM_COMMAND     → 执行菜单命令</text>
    </g>
  </g>

  <text x="40" y="548" font-size="10.5" fill="#5d6577">纯 C# · 无 DLL · 不注入进程 · 不修改 Unity 安装目录</text>
</svg>
